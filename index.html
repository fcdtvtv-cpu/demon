<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMON</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#000;
    color:#0a0;
    font-family:'Courier New',Courier,monospace;
    overflow:hidden;
    height:100vh;
    width:100vw;
    cursor:none;
    user-select:none;
}
body::after {
    content:'';
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:50; opacity:.3;
}
#red-flash {
    position:fixed; inset:0;
    background:rgba(80,0,0,.35);
    opacity:0; pointer-events:none; z-index:40;
    transition:opacity .07s;
}
#scanline {
    position:fixed; left:0; width:100%; height:2px;
    background:linear-gradient(90deg,transparent,rgba(0,120,20,.3),transparent);
    opacity:.12; z-index:30; pointer-events:none;
    animation:scan 6s linear infinite;
}
@keyframes scan { 0%{top:-3%} 100%{top:103%} }

#stage {
    position:fixed; inset:0;
    display:flex; justify-content:center; align-items:center;
    z-index:10;
}

#orbit {
    position: relative;
    width: min(420px, 88vw);
    height: min(420px, 88vw);
    display: flex;
    justify-content: center;
    align-items: center;
}

#stack {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#eyeWrap {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translate(-50%, 35%);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    width: 55%;
    display: flex;
    justify-content: center;
}
#headWrap { position: relative; z-index: 1; }

#srcHead, #srcEye, #srcSkull { display:none; }
pre.ascii {
    margin:0; white-space:pre;
    color:#0a0;
    text-shadow:0 0 3px #050, 0 0 8px rgba(0,100,0,.3);
    opacity: 0;
}
#asciiHead {
    font-size:3.6px; line-height:3px;
    transform:scaleX(2.2); transform-origin:center center;
}
#asciiEye {
    font-size: 2.4px; line-height: 2px;
    transform: scaleX(1.7); transform-origin: center center;
}

/* skulls on orbit */
.skull {
    position: absolute;
    left: 50%; top: 50%;
    width: 100px;
    height: 100px;
    margin-left: -50px;
    margin-top: -50px;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 2;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
}
.skull pre {
    font-size: 3px;
    line-height: 2.5px;
    transform: scaleX(1.7);
    transform-origin: center center;
    color: #0a0;
    text-shadow: 0 0 3px #050, 0 0 8px rgba(0,100,0,.3);
    margin: 0;
    white-space: pre;
}
.skull.visible { opacity: 1; }

.glitch-a { animation: ag .22s linear; }
@keyframes ag {
    0%  { filter:none; }
    25% { filter:contrast(1.35); }
    50% { filter:none; }
    75% { filter:contrast(1.2); }
    100%{ filter:none; }
}

.shake { animation: sh .38s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes sh {
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(3px)}
    30%,50%,70%{transform:translateX(-5px)}
    40%,60%{transform:translateX(5px)}
}

#cur {
    position:fixed; width:14px; height:14px;
    border:1px solid #060; border-radius:50%;
    pointer-events:none; z-index:100;
    transform:translate(-50%,-50%);
    mix-blend-mode:difference;
}
#cur.big { width:32px; height:32px; border-color:#600; }

.top {
    position:fixed; top:10px; right:14px;
    font-size:10px; letter-spacing:2px; color:#030; z-index:60;
}

/* head pulse */
#stack.alive {
    animation: breath 3.2s ease-in-out infinite;
}
@keyframes breath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
}

/* full screen glitch */
#stage.hard-glitch {
    animation: hardG 0.35s steps(2) both;
}
@keyframes hardG {
    0% { filter: none; transform: translate(0); }
    20% { filter: hue-rotate(90deg) contrast(1.6); transform: translate(-6px, 2px); }
    40% { filter: invert(0.15) contrast(1.4); transform: translate(5px, -3px); }
    60% { filter: none; transform: translate(-3px, 1px); }
    80% { filter: contrast(1.5); transform: translate(4px, 2px); }
    100% { filter: none; transform: translate(0); }
}

/* radar ring */
#radar {
    position: absolute;
    left: 50%; top: 50%;
    width: 0; height: 0;
    border: 1px solid rgba(0, 160, 40, 0.25);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    box-shadow: 0 0 12px rgba(0, 120, 30, 0.15);
}
#radar.on {
    opacity: 1;
    animation: radarPulse 4s linear infinite;
}
@keyframes radarPulse {
    0%   { width: 40px; height: 40px; opacity: 0.5; }
    70%  { opacity: 0.2; }
    100% { width: 380px; height: 380px; opacity: 0; }
}

/* skull trail ghosts */
.trail {
    position: absolute;
    left: 50%; top: 50%;
    width: 100px; height: 100px;
    margin-left: -50px; margin-top: -50px;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
}
.trail pre {
    font-size: 3px; line-height: 2.5px;
    transform: scaleX(1.7);
    transform-origin: center center;
    color: #040;
    margin: 0; white-space: pre;
}

/* cursor symbols */
#symBits {
    position: fixed;
    pointer-events: none;
    z-index: 99;
    font-size: 11px;
    color: #0a0;
    text-shadow: 0 0 4px #050;
    opacity: 0;
    transition: opacity 0.15s;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
}


/* === HARD EFFECTS === */
#blackout {
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 80;
    transition: opacity 0.05s;
}
#blackout.on { opacity: 1; }

#redVeil {
    position: fixed; inset: 0;
    background: rgba(120, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    z-index: 75;
    transition: opacity 0.08s;
}
#redVeil.on { opacity: 1; }

#static {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 78;
    opacity: 0;
    mix-blend-mode: screen;
}
#static.on { opacity: 0.35; }

#scanBeam {
    position: absolute;
    left: -20%; right: -20%;
    height: 3px;
    background: linear-gradient(90deg, transparent, rgba(0,255,60,0.7), transparent);
    box-shadow: 0 0 12px rgba(0,200,40,0.5);
    opacity: 0;
    pointer-events: none;
    z-index: 7;
}
#scanBeam.on {
    opacity: 1;
    animation: beam 0.7s linear forwards;
}
@keyframes beam {
    0% { top: 0%; }
    100% { top: 100%; }
}

/* stretch/scream on head */
#stack.scream pre {
    animation: scream 0.28s steps(2) both;
}
@keyframes scream {
    0% { transform: scaleX(2.2); }
    30% { transform: scaleX(3.4) scaleY(0.85); }
    60% { transform: scaleX(1.6) scaleY(1.15); }
    100% { transform: scaleX(2.2); }
}
#asciiEye.scream {
    animation: screamEye 0.28s steps(2) both;
}
@keyframes screamEye {
    0% { transform: scaleX(1.7); }
    40% { transform: scaleX(2.8) scaleY(0.5); }
    100% { transform: scaleX(1.7); }
}

/* eye blink */
#asciiEye.blink {
    animation: blink 0.35s steps(1) both;
}
@keyframes blink {
    0% { transform: scaleX(1.7) scaleY(1); opacity: 1; }
    40% { transform: scaleX(1.7) scaleY(0.08); opacity: 0.6; }
    70% { transform: scaleX(1.7) scaleY(0.08); opacity: 0.6; }
    100% { transform: scaleX(1.7) scaleY(1); opacity: 1; }
}

/* invert flash */
#stage.invert {
    filter: invert(1) hue-rotate(180deg);
}

/* ghost double */
#ghost {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-42%, -48%);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    filter: blur(0.5px);
}
#ghost.on {
    opacity: 0.28;
    transition: opacity 0.1s;
}
#ghost pre {
    font-size: 3.6px; line-height: 3px;
    transform: scaleX(2.2);
    color: #060;
    text-shadow: none;
    margin: 0; white-space: pre;
}


/* WATCHING title */
#watchWord {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 70;
    pointer-events: none;
    opacity: 0;
    text-align: center;
}
#watchWord.on {
    opacity: 1;
    animation: watchIn 1.4s steps(2) both;
}
#watchWord pre {
    font-family: 'Courier New', monospace;
    font-size: clamp(14px, 3.2vw, 28px);
    line-height: 1.05;
    letter-spacing: 3px;
    color: #060;
    text-shadow: 0 0 8px #040, 0 0 20px rgba(0,80,0,.4);
    margin: 0;
    white-space: pre;
}
@keyframes watchIn {
    0% { opacity: 0; filter: blur(4px); transform: translate(-50%, -50%) scaleX(1.4); }
    15% { opacity: 1; filter: none; transform: translate(-50%, -50%) scaleX(1); }
    75% { opacity: 1; }
    100% { opacity: 0; filter: blur(2px); }
}

/* SCREAMER overlay */
#screamer {
    position: fixed;
    inset: 0;
    z-index: 85;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
}
#screamer.on {
    opacity: 1;
}
#screamer pre {
    font-size: clamp(6px, 1.4vw, 12px);
    line-height: 0.95;
    color: #0f0;
    text-shadow: 0 0 10px #0a0, 0 0 30px rgba(0,255,0,.5);
    transform: scaleX(2.2) scale(1.4);
    white-space: pre;
    margin: 0;
}
#screamer.red pre {
    color: #f00;
    text-shadow: 0 0 12px #a00, 0 0 40px rgba(255,0,0,.6);
}


/* pentagram / 666 behind head */
#sigil {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    opacity: 0;
    pointer-events: none;
}
#sigil pre {
    font-size: 3.2px;
    line-height: 2.8px;
    transform: scaleX(1.8);
    color: #050;
    text-shadow: 0 0 6px #030;
    margin: 0;
    white-space: pre;
    text-align: center;
}
#sigil.on { opacity: 0.55; transition: opacity 0.3s; }
#sigil.flash {
    opacity: 0.9;
    animation: sigilFlash 0.6s ease both;
}
@keyframes sigilFlash {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
    40% { opacity: 0.95; transform: translate(-50%,-50%) scale(1.05); }
    100% { opacity: 0.4; transform: translate(-50%,-50%) scale(1); }
}

/* spikes around orbit */
.spike {
    position: absolute;
    left: 50%; top: 50%;
    width: 28px; height: 28px;
    margin-left: -14px; margin-top: -14px;
    opacity: 0;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.4s;
}
.spike pre {
    font-size: 2px;
    line-height: 1.6px;
    transform: scaleX(1.4);
    color: #070;
    margin: 0;
    white-space: pre;
}
.spike.visible { opacity: 0.7; }


/* crack / split head */
#stack.crack #asciiHead {
    animation: crack 0.55s steps(2) both;
}
@keyframes crack {
    0% { transform: scaleX(2.2) translate(0,0); }
    25% { transform: scaleX(2.2) translate(-12px, 2px) rotate(-2deg); clip-path: inset(0 50% 0 0); }
    50% { transform: scaleX(2.2) translate(12px, -2px) rotate(2deg); clip-path: inset(0 0 0 50%); }
    75% { transform: scaleX(2.2) translate(-6px, 1px); }
    100% { transform: scaleX(2.2) translate(0,0); clip-path: none; }
}

/* shadow skulls */
.skull.shadow {
    opacity: 0 !important;
}
.skull.shadow.visible {
    opacity: 0.25 !important;
    filter: brightness(0.5);
}
.skull.shadow pre {
    color: #030 !important;
    text-shadow: none !important;
}

/* idle darken */
#idleDark {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    opacity: 0;
    pointer-events: none;
    z-index: 65;
    transition: opacity 1.2s;
}
#idleDark.on { opacity: 1; }
#idleText {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 66;
    opacity: 0;
    pointer-events: none;
    text-align: center;
}
#idleText.on {
    opacity: 1;
    transition: opacity 0.8s;
}
#idleText pre {
    font-family: 'Courier New', monospace;
    font-size: clamp(12px, 2.8vw, 24px);
    line-height: 1.05;
    letter-spacing: 2px;
    color: #400;
    text-shadow: 0 0 10px #200;
    margin: 0;
    white-space: pre;
}

</style>
</head>

<script>
setInterval(()=>{ document.getElementById('clk').textContent=new Date().toTimeString().slice(0,8); },1000);
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{ cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'; });
document.addEventListener('mousedown',()=>cur.classList.add('big'));
document.addEventListener('mouseup',()=>cur.classList.remove('big'));

const flash=document.getElementById('red-flash');
function doFlash(){ flash.style.opacity='.38'; setTimeout(()=>flash.style.opacity='0',75); }
function doShake(){
    const s = document.getElementById('stack');
    s.classList.add('shake');
    setTimeout(()=>s.classList.remove('shake'),400);
}
setInterval(()=>{ if(Math.random()>.6) doFlash(); },3000);

const density=" .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

function imgToAscii(img, width) {
    const canvas = document.createElement('canvas');
    const c = canvas.getContext('2d');
    const height = Math.floor((img.height / img.width) * width);
    canvas.width = width; canvas.height = height;
    c.drawImage(img, 0, 0, width, height);
    const pixels = c.getImageData(0, 0, width, height).data;
    let out = '';
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const o = (y * width + x) * 4;
            const r = pixels[o], g = pixels[o+1], b = pixels[o+2], a = pixels[o+3];
            if (a < 40) { out += ' '; continue; }
            const avg = (r + g + b) / 3;
            if (avg < 8) { out += ' '; continue; }
            const idx = Math.floor((avg / 255) * (density.length - 1));
            out += density[Math.max(0, Math.min(density.length - 1, idx))];
        }
        out += '\n';
    }
    return out;
}

function revealAscii(pre, text, speed, onDone) {
    const lines = text.split('\n');
    pre.innerText = '';
    pre.style.opacity = '1';
    let i = 0;
    (function step() {
        if (i < lines.length) {
            pre.innerText += lines[i] + '\n';
            i++;
            setTimeout(step, speed + Math.random() * speed);
        } else if (onDone) onDone();
    })();
}

/* orbit animation */
let angle = 0;
const radius = () => Math.min(190, Math.min(window.innerWidth, window.innerHeight) * 0.26);
function placeSkulls() {
    const r = radius();
    for (let i = 0; i < 4; i++) {
        const a = angle + (i * Math.PI * 2 / 4);
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        const el = document.getElementById('sk' + i);
        el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
}
function spin() {
    angle += 0.008;
    placeSkulls();
    requestAnimationFrame(spin);
}

function start() {
    const headImg = document.getElementById('srcHead');
    const eyeImg = document.getElementById('srcEye');
    const skullImg = document.getElementById('srcSkull');
    const asciiHead = document.getElementById('asciiHead');
    const asciiEye = document.getElementById('asciiEye');
    const eyeWrap = document.getElementById('eyeWrap');

    function go() {
        // convert skull once, clone to 4
        const skullArt = imgToAscii(skullImg, 48);
        for (let i = 0; i < 4; i++) {
            document.querySelector('#sk' + i + ' pre').textContent = skullArt;
        }

        // head
        const headArt = imgToAscii(headImg, 130);
        revealAscii(asciiHead, headArt, 4, () => {
            startFX();
            // eye
            setTimeout(() => {
                eyeWrap.style.opacity = '1';
                const eyeArt = imgToAscii(eyeImg, 42);
                revealAscii(asciiEye, eyeArt, 6, () => {
                    // skulls appear and start orbiting
                    setTimeout(() => {
                        for (let i = 0; i < 4; i++) {
                            setTimeout(() => {
                                document.getElementById('sk' + i).classList.add('visible');
                            }, i * 180);
                        }
                        placeSkulls();
                        spin();
                        document.getElementById('stack').classList.add('alive');
                        document.getElementById('radar').classList.add('on');
                        startHardGlitch();
                        startHardEngine();
                        startWatchAndScreamer();
                        startSigilEngine();
                        startExtraHard();
                        // copy skull art to trails
                        const art = document.querySelector('#sk0 pre').textContent;
                        for (let i = 0; i < 4; i++) {
                            document.querySelector('#tr' + i + ' pre').textContent = art;
                        }
                        startTrails();
                    }, 400);
                });
            }, 400);
        });
    }

    let ready = 0;
    function check() { ready++; if (ready >= 3) go(); }
    if (headImg.complete && headImg.naturalWidth) check(); else headImg.onload = check;
    if (eyeImg.complete && eyeImg.naturalWidth) check(); else eyeImg.onload = check;
    if (skullImg.complete && skullImg.naturalWidth) check(); else skullImg.onload = check;
}

function startFX() {
    const asciiHead = document.getElementById('asciiHead');
    const asciiEye = document.getElementById('asciiEye');
    setInterval(() => {
        asciiHead.classList.add('glitch-a');
        asciiEye.classList.add('glitch-a');
        setTimeout(() => {
            asciiHead.classList.remove('glitch-a');
            asciiEye.classList.remove('glitch-a');
        }, 240);
        if (Math.random() > 0.5) doFlash();
    }, 2400 + Math.random() * 2600);
    setInterval(() => { doShake(); }, 4200 + Math.random() * 3600);
}


/* trails - lag behind skulls */
const trailAngles = [0, 0, 0, 0];
function startTrails() {
    setInterval(() => {
        const r = radius();
        for (let i = 0; i < 4; i++) {
            // lag by ~0.4 rad
            const a = trailAngles[i];
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r;
            const el = document.getElementById('tr' + i);
            el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
            el.style.opacity = '0.22';
        }
    }, 40);
}
// update trail angles from main spin
const _place = placeSkulls;
placeSkulls = function() {
    _place();
    for (let i = 0; i < 4; i++) {
        trailAngles[i] = angle + (i * Math.PI * 2 / 4) - 0.45;
    }
};

function startHardGlitch() {
    setInterval(() => {
        if (Math.random() > 0.4) return;
        const st = document.getElementById('stage');
        st.classList.add('hard-glitch');
        doFlash();
        setTimeout(() => st.classList.remove('hard-glitch'), 360);
    }, 9000 + Math.random() * 5000);
}

/* cursor symbols */
const bits = '01#$%@&<>/\\|';
const symEl = document.getElementById('symBits');
let symTimer = null;
document.addEventListener('mousemove', e => {
    if (Math.random() > 0.08) return;
    let s = '';
    for (let i = 0; i < 3 + (Math.random()*3|0); i++) s += bits[Math.random()*bits.length|0];
    symEl.textContent = s;
    symEl.style.left = (e.clientX + 14) + 'px';
    symEl.style.top = (e.clientY - 10) + 'px';
    symEl.style.opacity = '0.7';
    clearTimeout(symTimer);
    symTimer = setTimeout(() => { symEl.style.opacity = '0'; }, 180);
});



/* ===== HARD FX ENGINE ===== */
const blackout = document.getElementById('blackout');
const redVeil = document.getElementById('redVeil');
const staticC = document.getElementById('static');
const sctx = staticC.getContext('2d');
function resizeStatic() {
    staticC.width = innerWidth;
    staticC.height = innerHeight;
}
resizeStatic();
addEventListener('resize', resizeStatic);

function drawStatic() {
    const w = staticC.width, h = staticC.height;
    const img = sctx.createImageData(w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255 | 0;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
    }
    sctx.putImageData(img, 0, 0);
}

function fxBlackout(ms) {
    blackout.classList.add('on');
    setTimeout(() => blackout.classList.remove('on'), ms || 120);
}
function fxRedVeil(ms) {
    redVeil.classList.add('on');
    setTimeout(() => redVeil.classList.remove('on'), ms || 400);
}
function fxStatic(ms) {
    staticC.classList.add('on');
    const id = setInterval(drawStatic, 30);
    setTimeout(() => {
        clearInterval(id);
        staticC.classList.remove('on');
    }, ms || 160);
}
function fxScream() {
    const st = document.getElementById('stack');

function fxSkullLunge() {
    const i = Math.random() * 4 | 0;
    const el = document.getElementById('sk' + i);
    if (!el) return;
    const prev = el.style.transform;
    // pull toward center ~40%
    el.style.transition = 'transform 0.18s ease-out';
    const r = radius() * 0.35;
    const a = angle + (i * Math.PI * 2 / 4);
    el.style.transform = 'translate(' + (Math.cos(a)*r) + 'px,' + (Math.sin(a)*r) + 'px) scale(1.25)';
    setTimeout(() => {
        el.style.transition = 'transform 0.35s ease-in';
        // return handled by next placeSkulls frame; force refresh
        setTimeout(() => { el.style.transition = ''; }, 360);
    }, 200);
}

/* master hard sequence scheduler */
function startHardEngine() {
    // copy head to ghost when ready
    setTimeout(() => {
        const head = document.getElementById('asciiHead');
        const gp = document.getElementById('ghostPre');
        if (head) gp.textContent = head.textContent;
    }, 2000);

    // blink eye periodically
    setInterval(() => {

    }, 7000 + Math.random() * 5000);

    // scan beam
    setInterval(() => {
        if (Math.random() > 0.4) fxScan();
    }, 8000 + Math.random() * 6000);

    // combo hits
    setInterval(() => {
        const roll = Math.random();
        if (roll < 0.15) {
            // heavy: blackout + static + scream + red
            fxBlackout(100);
            setTimeout(() => {
                fxStatic(150);
                fxScream();
                fxRedVeil(350);
                doFlash();
            }, 110);
        } else if (roll < 0.3) {
            fxInvert(90);
            fxScream();
            doFlash();
        } else if (roll < 0.45) {
            fxGhost();
            fxRedVeil(250);
        } else if (roll < 0.6) {
            fxSkullLunge();
            doFlash();
        } else if (roll < 0.75) {
            fxStatic(120);
            doShake();
        } else {
            fxBlackout(80);
            setTimeout(() => doFlash(), 90);
        }
    }, 6500 + Math.random() * 4500);
}

/* sound after first click */
let audioCtx = null;
function ensureAudio() {
    if (audioCtx) return audioCtx;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function beep(freq, dur, type, vol) {
    try {
        const ctx = ensureAudio();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type || 'sawtooth';
        o.frequency.value = freq;
        g.gain.value = vol || 0.04;
        o.connect(g); g.connect(ctx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.stop(ctx.currentTime + dur);
    } catch(e) {}
}
function rumble(dur) {
    try {
        const ctx = ensureAudio();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'square';
        o.frequency.value = 45;
        g.gain.value = 0.03;
        o.connect(g); g.connect(ctx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.stop(ctx.currentTime + dur);
    } catch(e) {}
}
document.addEventListener('click', () => {
    ensureAudio();
    rumble(0.4);
}, { once: true });

/* WATCHING + SCREAMER */
const FONT5 = {
W:["█   █ ","█   █ ","█ █ █ ","██ ██ ","█   █ "],
A:[" ███  ","█   █ ","█████ ","█   █ ","█   █ "],
T:["█████ ","  █   ","  █   ","  █   ","  █   "],
C:[" ████ ","█     ","█     ","█     "," ████ "],
H:["█   █ ","█   █ ","█████ ","█   █ ","█   █ "],
I:["█████ ","  █   ","  █   ","  █   ","█████ "],
N:["█   █ ","██  █ ","█ █ █ ","█  ██ ","█   █ "],
G:[" ████ ","█     ","█  ██ ","█   █ "," ████ "],
' ':["      ","      ","      ","      ","      "],
};
function makeWord(text) {
    const rows = ['','','','',''];
    for (const ch of text.toUpperCase()) {
        const g = FONT5[ch] || FONT5[' '];
        for (let r=0;r<5;r++) rows[r] += g[r] + '  ';
    }
    return rows.join('\n');
}

function showWatching() {
    const el = document.getElementById('watchWord');
    const pre = document.getElementById('watchPre');
    pre.textContent = makeWord('WATCHING');
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
    try { beep(120, 0.2, 'square', 0.04); } catch(e) {}
}

function triggerScreamer() {
    const sc = document.getElementById('screamer');
    const pre = document.getElementById('screamerPre');
    // use eye ascii if available, else head
    const eye = document.getElementById('asciiEye');
    const head = document.getElementById('asciiHead');
    let art = (eye && eye.textContent.trim()) ? eye.textContent : (head ? head.textContent : '');
    if (!art) return;
    pre.textContent = art;
    sc.classList.add('on');
    if (Math.random() > 0.5) sc.classList.add('red');
    else sc.classList.remove('red');
    // harsh sound
    try {
        beep(90, 0.15, 'sawtooth', 0.08);
        beep(40, 0.25, 'square', 0.06);
        rumble(0.3);
    } catch(e) {}
    setTimeout(() => {
        sc.classList.remove('on');
        sc.classList.remove('red');
    }, 90 + Math.random() * 50);
}

function startWatchAndScreamer() {
    // rare WATCHING
    setInterval(() => {
        if (Math.random() > 0.55) showWatching();
    }, 14000 + Math.random() * 10000);

    // screamer on heaviest moments - hook into combo
    setInterval(() => {
        if (Math.random() > 0.72) return;
        // blackout then SCREAM
        fxBlackout(80);
        setTimeout(() => {
            triggerScreamer();
            fxStatic(100);
            doFlash();
        }, 85);
    }, 18000 + Math.random() * 12000);
}



/* SIGILS + SPIKES + MASK SWAP */
let currentSigil = 'penta';
let headArtCache = '';
let maskArtCache = '';

function buildSigilsAndSpikes() {
    const pentaImg = document.getElementById('srcPenta');
    const sixImg = document.getElementById('srcSix');
    const spikeImg = document.getElementById('srcSpike');
    const pentaArt = imgToAscii(pentaImg, 55);
    const sixArt = imgToAscii(sixImg, 50);
    const spikeArt = imgToAscii(spikeImg, 16);

    window._pentaArt = pentaArt;
    window._sixArt = sixArt;

    for (let i = 0; i < 8; i++) {
        document.querySelector('#sp' + i + ' pre').textContent = spikeArt;
    }
}

function showSigil(kind) {
    const pre = document.getElementById('sigilPre');
    const el = document.getElementById('sigil');
    pre.textContent = kind === 'six' ? window._sixArt : window._pentaArt;
    currentSigil = kind;
    el.classList.add('on');
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
}

function placeSpikes() {
    const r = radius() * 1.15;
    const base = angle * 0.35; // slow drift
    for (let i = 0; i < 8; i++) {
        const a = base + (i * Math.PI * 2 / 8);
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        const el = document.getElementById('sp' + i);
        // rotate spike to point outward
        const deg = (a * 180 / Math.PI) + 90;
        el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + deg + 'deg)';
    }
}

function startSpikes() {
    for (let i = 0; i < 8; i++) {
        setTimeout(() => document.getElementById('sp' + i).classList.add('visible'), i * 80);
    }
    // hook into placeSkulls
    const _p = placeSkulls;
    placeSkulls = function() {
        _p();
        placeSpikes();
    };
}

function fxMaskSwap() {
    const head = document.getElementById('asciiHead');
    if (!head || !headArtCache) return;
    // invert-ish: reverse lines or use six/penta as "mask"
    const alt = maskArtCache || window._sixArt;
    const orig = head.textContent;
    head.textContent = alt;
    head.style.color = '#800';
    setTimeout(() => {
        head.textContent = orig;
        head.style.color = '';
    }, 220);
    try { beep(70, 0.12, 'sawtooth', 0.05); } catch(e) {}
}

function startSigilEngine() {
    buildSigilsAndSpikes();
    // cache head
    setTimeout(() => {
        const h = document.getElementById('asciiHead');
        if (h) headArtCache = h.textContent;
        // mask = slightly corrupted head or six
        maskArtCache = window._sixArt;
    }, 2500);

    startSpikes();
    // first sigil: pentagram behind
    setTimeout(() => showSigil('penta'), 1200);

    // alternate 666 / star
    setInterval(() => {
        showSigil(currentSigil === 'penta' ? 'six' : 'penta');
    }, 11000 + Math.random() * 6000);

    // rare mask swap
    setInterval(() => {
        if (Math.random() > 0.5) fxMaskSwap();
    }, 13000 + Math.random() * 8000);
}



/* 2 CRACK  3 SHADOW SKULLS  4 EYE MORPH  8 CLICK RAGE  9 SPEED  10 IDLE */
let spinSpeed = 0.008;
let lastMove = Date.now();
let idleOn = false;

function fxCrack() {
    const st = document.getElementById('stack');
    st.classList.add('crack');
    setTimeout(() => st.classList.remove('crack'), 560);
    try { beep(55, 0.18, 'square', 0.05); } catch(e) {}

function fxEyeMorph() {
    const eye = document.getElementById('asciiEye');
    if (!eye || !window._sixArt) return;
    const orig = eye.textContent;
    eye.textContent = window._sixArt;
    eye.style.color = '#800';
    setTimeout(() => {
        eye.textContent = orig;
        eye.style.color = '';
    }, 280);
    try { beep(100, 0.1, 'sawtooth', 0.04); } catch(e) {}
}

function initShadowSkulls() {
    const art = document.querySelector('#sk0 pre').textContent;
    for (let i = 4; i < 8; i++) {
        document.querySelector('#sk' + i + ' pre').textContent = art;
        setTimeout(() => document.getElementById('sk' + i).classList.add('visible'), 500 + (i-4)*120);
    }
}

// extend placeSkulls for shadow layer (opposite phase, slower feel via angle offset)
const __placeSkulls = typeof placeSkulls === 'function' ? placeSkulls : null;
function placeAllSkulls() {
    const r = radius();
    for (let i = 0; i < 4; i++) {
        const a = angle + (i * Math.PI * 2 / 4);
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        const el = document.getElementById('sk' + i);
        if (el) el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
    // shadow: reverse direction, slightly larger radius
    const r2 = r * 1.12;
    for (let i = 0; i < 4; i++) {
        const a = -angle * 0.65 + (i * Math.PI * 2 / 4) + Math.PI / 4;
        const x = Math.cos(a) * r2;
        const y = Math.sin(a) * r2;
        const el = document.getElementById('sk' + (i + 4));
        if (el) el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
    // trails + spikes if exist
    try {
        for (let i = 0; i < 4; i++) {
            trailAngles[i] = angle + (i * Math.PI * 2 / 4) - 0.45;
        }
    } catch(e) {}
    try { placeSpikes(); } catch(e) {}
}

// replace spin to use spinSpeed and placeAllSkulls
function spin() {
    angle += spinSpeed;
    placeAllSkulls();
    requestAnimationFrame(spin);
}

function rageClick() {
    // full chaos
    fxBlackout(100);
    setTimeout(() => {
        triggerScreamer();
        fxStatic(140);
        fxScream();
        fxCrack();
        fxRedVeil(400);
        fxSkullLunge();
        doFlash();
        try { rumble(0.5); beep(50, 0.3, 'square', 0.07); } catch(e) {}
    }, 100);
}

function setupClickRage() {
    const stack = document.getElementById('stack');
    stack.style.cursor = 'crosshair';
    stack.addEventListener('click', (e) => {
        e.stopPropagation();
        rageClick();
    });
}

function setupSpeedControl() {
    document.addEventListener('mousemove', () => {
        lastMove = Date.now();
        // boost speed briefly
        spinSpeed = Math.min(0.028, spinSpeed + 0.0015);
        if (idleOn) wakeFromIdle();
    });
    // decay speed
    setInterval(() => {
        spinSpeed = Math.max(0.008, spinSpeed * 0.92);
    }, 200);
}

function showStillHere() {
    const pre = document.getElementById('idlePre');
    if (typeof makeWord === 'function') {
        pre.textContent = makeWord('STILL HERE');
    } else {
        pre.textContent = 'STILL HERE?';
    }
    document.getElementById('idleDark').classList.add('on');
    document.getElementById('idleText').classList.add('on');
    idleOn = true;
    try { beep(40, 0.4, 'sine', 0.03); } catch(e) {}
}
function wakeFromIdle() {
    document.getElementById('idleDark').classList.remove('on');
    document.getElementById('idleText').classList.remove('on');
    idleOn = false;
    lastMove = Date.now();
}
function setupIdle() {
    setInterval(() => {
        if (Date.now() - lastMove > 15000 && !idleOn) {
            showStillHere();
        }
    }, 2000);
}

function startExtraHard() {
    initShadowSkulls();
    setupClickRage();
    setupSpeedControl();
    setupIdle();

    // crack periodically
    setInterval(() => {
        if (Math.random() > 0.5) fxCrack();
    }, 12000 + Math.random() * 8000);

    // eye morph
    setInterval(() => {
        if (Math.random() > 0.45) fxEyeMorph();
    }, 10000 + Math.random() * 7000);
}
