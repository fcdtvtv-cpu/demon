    <script>
        const img = document.getElementById('sourceImage');
        const output = document.getElementById('ascii-output');

        // Символы: сначала пробел (для темного фона), потом густые символы для рожи
        const density = ' .:-=+*#%@';

        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Ширина ASCII-картинки (количество символов в строке)
            const width = 150; 
            const height = Math.floor((img.height / img.width) * width);
            
            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(img, 0, 0, width, height);

            const imageData = ctx.getImageData(0, 0, width, height);
            const pixels = imageData.data;

            let asciiImage = '';

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const offset = (y * width + x) * 4;
                    const r = pixels[offset];
                    const g = pixels[offset + 1];
                    const b = pixels[offset + 2];
                    // Прозрачность
                    const a = pixels[offset + 3];

                    // Если пиксель прозрачный, рисуем пробел
                    if (a < 128) {
                        asciiImage += ' ';
                        continue;
                    }

                    // Считаем яркость
                    const avg = (r + g + b) / 3;

                    // ИНВЕРТИРУЕМ ЯРКОСТЬ: 
                    // Теперь белые пиксели (рожа) дадут высокий индекс (символы),
                    // а черные (фон) дадут низкий индекс (пробелы).
                    const brightness = 255 - avg; 
                    
                    // Ищем индекс символа
                    const charIndex = Math.floor(((255 - brightness) / 255) * (density.length - 1));
                    const char = density[charIndex];

                    asciiImage += char;
                }
                asciiImage += '\n';
            }

            output.innerText = asciiImage;
        };
    </script>
